name: Validate 3DCorpCod

on:
  push:
    branches: ["main"]
    paths:
      - "3DCorpCod/**"
      - ".github/workflows/webpack.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "3DCorpCod/**"
      - ".github/workflows/webpack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 3DCorpCod/package.json
      - name: Install dependencies
        working-directory: 3DCorpCod
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: 3DCorpCod
        run: npm run build

      - name: Run regression tests
        working-directory: 3DCorpCod
        run: npm test
