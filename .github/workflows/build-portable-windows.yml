name: Build 3DCorpCod Portable for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '3DCorpCod/**'
      - '.github/workflows/build-portable-windows.yml'
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 3DCorpCod
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable Windows application
        run: npm run dist:win

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: 3DCorpCod-Portable-Windows
          path: 3DCorpCod/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 3DCorpCod/release/*.exe
          generate_release_notes: true
