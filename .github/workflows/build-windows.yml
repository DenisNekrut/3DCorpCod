name: Build Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 3DCorpCod
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 3DCorpCod/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable Windows app
        run: npm run dist:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DCorpCod-Windows-Portable
          path: 3DCorpCod/release/*.exe
          if-no-files-found: error
          retention-days: 14
